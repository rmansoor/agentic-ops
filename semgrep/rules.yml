rules:
  - id: subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      subprocess called with shell=True. If any part of the command comes from user input this is
      command injection. Pass a list of arguments and drop shell=True.
    pattern: subprocess.$FUNC(..., shell=True, ...)
    metadata: {category: security, cwe: "CWE-78"}

  - id: sql-built-with-string-formatting
    languages: [python]
    severity: ERROR
    message: >-
      SQL built with string formatting. Use parameterized queries (cursor.execute(sql, params)).
    pattern-either:
      - pattern: $CUR.execute(f"...", ...)
      - pattern: $CUR.execute("..." % $X, ...)
      - pattern: $CUR.execute("...".format(...), ...)
      - pattern: $CUR.execute("..." + $X, ...)
    metadata: {category: security, cwe: "CWE-89"}

  - id: llm-system-prompt-from-fstring
    languages: [python]
    severity: WARNING
    message: >-
      LLM system prompt built with an f-string. Make sure no untrusted input (PR text, user messages,
      file contents) flows into the system prompt; pass it as delimited user content instead
      (prompt-injection risk).
    pattern-either:
      - pattern: $CLIENT.messages.create(..., system=f"...", ...)
      - pattern: '{"role": "system", "content": f"..."}'
    metadata: {category: security, owasp-llm: "LLM01 Prompt Injection"}

  - id: hardcoded-credential
    languages: [python, javascript, typescript, java]
    severity: ERROR
    message: Possible hard-coded credential. Load secrets from the environment or a secret manager.
    # The value must contain a digit: real keys do, attribute/config names like "pre_authentication_token" don't.
    pattern-regex: (?i)(api[_-]?key|secret|passwd|password|token)\s*[:=]\s*["'](?=[^"']*\d)[A-Za-z0-9_\-/+]{16,}["']
    metadata: {category: security, cwe: "CWE-798"}

  - id: js-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: eval() executes arbitrary code. Parse data with JSON.parse or use a safe interpreter.
    pattern: eval(...)
    metadata: {category: security, cwe: "CWE-95"}

  - id: requests-without-timeout
    languages: [python]
    severity: WARNING
    message: HTTP call without a timeout can hang workers indefinitely. Pass timeout=...
    pattern-either:
      - pattern: requests.$M($URL)
      - pattern: requests.$M($URL, data=$D)
      - pattern: requests.$M($URL, json=$D)
    metadata: {category: reliability}

  # ---- Java ----
  - id: java-sql-built-with-string-concat
    languages: [java]
    severity: ERROR
    message: >-
      Query (SQL, JPQL or JCR/XPath) built with string concatenation or String.format. Use a
      PreparedStatement with ? placeholders, named parameters (JPA/JdbcTemplate), or JCR bind variables.
    patterns:
      - pattern-either:
          - pattern: $STMT.$EXEC($Q, ...)
          - pattern: |
              String $SQL = $Q;
              ...
              $STMT.$EXEC($SQL, ...);
      # Only JDBC/JPA/JdbcTemplate query methods, so ordinary string building isn't flagged.
      - metavariable-regex:
          metavariable: $EXEC
          regex: ^(execute|executeQuery|executeUpdate|executeLargeUpdate|addBatch|prepareStatement|createQuery|createNativeQuery|query|queryForObject|queryForList|update)$
      # The query must be built dynamically: a literal glued to something, or String.format.
      - metavariable-pattern:
          metavariable: $Q
          patterns:
            - pattern-either:
                - pattern: '"..." + $X'
                - pattern: '$X + "..."'
                - pattern: String.format(...)
            # Concatenated literals are a constant, not injection.
            - pattern-not: '"..."'
            # Don't look inside callbacks such as jcrTemplate.execute(new JcrCallback() { ... }).
            - pattern-not-inside: 'new $T(...) { ... }'
            - pattern-not-inside: '(...) -> { ... }'
    metadata: {category: security, cwe: "CWE-89"}

  - id: java-command-injection
    languages: [java]
    severity: ERROR
    message: >-
      Shell command built from a variable. If any part comes from user input this is command injection.
      Pass a fixed executable and separate arguments to ProcessBuilder.
    pattern-either:
      - pattern: Runtime.getRuntime().exec("..." + $X, ...)
      - pattern: new ProcessBuilder("sh", "-c", $X, ...)
      - pattern: new ProcessBuilder("bash", "-c", $X, ...)
      - pattern: new ProcessBuilder("cmd", "/c", $X, ...)
    metadata: {category: security, cwe: "CWE-78"}

  - id: java-unsafe-deserialization
    languages: [java]
    severity: WARNING
    message: >-
      Java native deserialization (ObjectInputStream.readObject) of untrusted data can lead to remote code
      execution. Prefer JSON, or set an ObjectInputFilter allow-list.
    pattern: (ObjectInputStream $IN).readObject()
    metadata: {category: security, cwe: "CWE-502"}

  - id: java-weak-hash
    languages: [java]
    severity: WARNING
    message: MD5/SHA-1 are broken for security use. Use SHA-256+, or bcrypt/argon2 for passwords.
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA-1")
      - pattern: MessageDigest.getInstance("SHA1")
    metadata: {category: security, cwe: "CWE-328"}

  - id: java-empty-catch
    languages: [java]
    severity: WARNING
    message: Exception silently swallowed. Log it, rethrow it, or comment why ignoring it is safe.
    pattern: |
      try { ... } catch ($T $E) { }
    metadata: {category: reliability}
