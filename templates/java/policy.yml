# Risk-based review policy for a Maven / Spring project.
# Tiers are evaluated top to bottom; the first match wins per file. The PR's tier is its riskiest file.
tiers:
  - name: high
    paths:
      - "**/auth/**"
      - "**/security/**"
      - "**/crypto/**"
      - "**/*Security*.java"
      - "**/*secret*"
      - "**/db/migration/**"          # Flyway
      - "**/db/changelog/**"          # Liquibase
      - "**/src/main/resources/application*.properties"
      - "**/src/main/resources/application*.yml"
      - "**/src/main/resources/application*.yaml"
      - "**/pom.xml"                  # dependency and plugin changes
      - ".mvn/**"
      - "mvnw"
      - ".github/workflows/**"
      - "Dockerfile"
    block_on: [error, warning]
    require_human_review: true

  - name: low
    paths:
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/src/test/**"
    block_on: []
    auto_approve: true   # only takes effect when AGENTIC_OPS_ALLOW_AUTO_APPROVE=true

default:
  name: medium
  block_on: [error]
