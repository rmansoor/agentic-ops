name: agentic-ops test generation

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Space-separated Python files to generate tests for (blank = lowest-coverage files)"
        required: false
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  testgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev,openai]" && pip install -r requirements.txt 2>/dev/null || true
      - name: Measure coverage
        run: |
          coverage run -m pytest -q || true
          coverage json -o coverage.json
      - name: Pick targets
        id: targets
        run: |
          if [ -n "${{ inputs.files }}" ]; then
            echo "files=${{ inputs.files }}" >> "$GITHUB_OUTPUT"
          else
            FILES=$(python - <<'PY'
          import json
          files = json.load(open("coverage.json"))["files"]
          ranked = sorted((v["summary"]["percent_covered"], k) for k, v in files.items()
                          if not k.startswith("tests/"))
          print(" ".join(k for _, k in ranked[:3]))
          PY
            )
            echo "files=$FILES" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate tests (keeps only passing tests)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
        # Some files may be discarded, which is fine; fail only if nothing passed (e.g. bad API key).
        run: |
          agentic-ops testgen ${{ steps.targets.outputs.files }} --coverage coverage.json | tee testgen.log || true
          grep -q '^\[PASS\]' testgen.log || { echo "::error::No generated tests passed; see output above"; exit 1; }
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: agentic-ops/generated-tests
          title: "test: AI-generated tests for low-coverage modules"
          body: "Generated by `agentic-ops testgen`. Only tests that pass against current code are included. Please review assertions before merging."
          add-paths: tests/generated/**
